name: Build LG V60 Kernel

on:
  workflow_dispatch:
  
jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Linux Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev \
          bison flex libelf-dev xz-utils git ccache crossbuild-essential-arm64 unzip curl

    - name: Download and Extract Android NDK 
      run: |
        curl -LO https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
        unzip -q android-ndk-r27c-linux.zip "android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/*"
        mkdir -p ${{ github.workspace }}/toolchain
        mv android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/* ${{ github.workspace }}/toolchain/
        rm -rf android-ndk-r27c-linux.zip android-ndk-r27c

    - name: Compile Custom Kernel
      run: |
        export PATH="${{ github.workspace }}/toolchain/bin:$PATH"
        
        # Define target system properties
        export ARCH=arm64
        export SUBARCH=arm64
        OUT_DIR="$(pwd)/out"
        DEFCONFIG="timelm_defconfig"
        CUSTOM_NAME="-kiy0"

        echo "Verifying Clang version inside GitHub Action:"
        clang --version

        echo "--- Step 1: Initializing Defconfig ---"
        make O=$OUT_DIR $DEFCONFIG \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu-

        echo "--- Step 2: Compiling Kernel Binary and DTBs ---"
        make -j$(nproc --all) O=$OUT_DIR \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LOCALVERSION=$CUSTOM_NAME \
            Image.gz dtbs

        echo "--- Step 3: Merging Device Tree and Verifying Outputs ---"
        if [ -f "$OUT_DIR/arch/arm64/boot/Image.gz" ]; then
            echo "Success! Merging Image.gz and compiled DTBs into integrated image..."
            cat $OUT_DIR/arch/arm64/boot/Image.gz $(find $OUT_DIR/arch/arm64/boot/dts/ -name "*.dtb") > $OUT_DIR/arch/arm64/boot/Image.gz-dtb
            echo "Generated output target file at: $OUT_DIR/arch/arm64/boot/Image.gz-dtb"
        else
            echo "Build process failed: Image.gz was not generated by the compiler."
            exit 1
        fi

    - name: Upload Finished Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LG-V60-Docomo-Kernel
        path: |
          out/arch/arm64/boot/Image.gz
          out/arch/arm64/boot/Image.gz-dtb
